<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111416">
  <meta name="rurusaika-style-version" content="{{STYLE_VERSION}}">
  <title>Blog Desk — RuruSaika</title>
  <link rel="icon" href="../../static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css?v={{STYLE_VERSION}}-2">
  <link rel="stylesheet" href="admin.css?v={{STYLE_VERSION}}-sort1">
  <link rel="stylesheet" href="../visual-v2.css?v={{STYLE_VERSION}}">
  <link rel="stylesheet" href="visual-v2.css?v={{STYLE_VERSION}}">
  <script src="../shared.js?v={{STYLE_VERSION}}" defer></script>
  <script src="admin.js?v={{STYLE_VERSION}}-sort1" defer></script>
</head>
<body class="admin-body">
  <div class="auth-screen" data-auth-screen>
    <div class="auth-card">
      <span class="auth-mark">R/</span>
      <p class="kicker">仅限本人使用</p>
      <h1>Blog 编辑区</h1>
      <p data-auth-message>正在确认编辑身份…</p>
      <a class="primary-button" data-sign-in href="/signin-with-chatgpt?return_to=%2Fstudy%2Fadmin%2F" hidden>使用 ChatGPT 账号登录</a>
      <button class="ghost-button auth-retry" data-retry-auth type="button" hidden>重新检查身份</button>
      <a class="text-link" href="../">返回公开 Blog</a>
    </div>
  </div>

  <div class="admin-app" data-admin-app hidden>
    <header class="admin-header">
      <div class="admin-brand"><span>R/</span><div><strong>Ruru's Blog</strong><small>私人编辑区 · {{STYLE_VERSION}}</small></div></div>
      <div class="admin-header-actions">
        <span class="save-state" data-save-state>所有修改均已保存</span>
        <a href="../" target="_blank" rel="noreferrer">查看 Blog ↗</a>
        <a data-export href="/api/study/admin/export">导出备份</a>
        <a href="/signout-with-chatgpt?return_to=%2Fstudy%2F">退出</a>
      </div>
    </header>

    <main class="admin-layout">
      <aside class="post-sidebar">
        <div class="sidebar-top"><div><span>文章</span><strong data-post-total>0</strong></div><button class="new-button" type="button" data-new-post>＋ 新文章</button></div>
        <label class="sidebar-search"><span>⌕</span><input type="search" data-admin-search placeholder="搜索文章…"></label>
        <p class="sort-help">拖动文章右侧的排序标志，设置 Blog 首页顺序。</p>
        <div class="post-list" data-post-list></div>
      </aside>

      <section class="editor" data-editor>
        <div class="editor-empty" data-editor-empty><div><span>＋</span><h2>选择一篇文章，<br>或者留下一段新的文字。</h2><button class="primary-button" type="button" data-empty-new>新建文章</button></div></div>
        <form data-post-form hidden>
          <input type="hidden" data-id>
          <div class="editor-toolbar">
            <div class="editor-status"><span class="status-dot"></span><span data-status-label>新草稿</span></div>
            <div class="editor-actions">
              <button class="ghost-button" type="button" data-preview-toggle>预览</button>
              <button class="ghost-button danger-button" type="button" data-archive hidden>归档</button>
              <button class="ghost-button delete-button" type="button" data-delete hidden>永久删除</button>
              <button class="ghost-button" type="button" data-save-draft>保存草稿</button>
              <button class="primary-button" type="submit" data-publish>发布文章</button>
            </div>
          </div>

          <div class="editor-scroll">
            <div class="field-row">
              <label><span>分类</span><select data-subject><option>生活</option><option>学习</option><option>其它</option></select></label>
              <label><span>标签 <small>用逗号分隔</small></span><input data-tags placeholder="日常，随笔，复盘"></label>
              <label class="pin-field"><input type="checkbox" data-pinned><span>置顶文章</span></label>
            </div>
            <label class="title-field"><span>标题</span><textarea data-title rows="2" maxlength="120" placeholder="给这次思考一个清楚的标题" required></textarea></label>
            <label><span>摘要 <small>会显示在文章卡片上</small></span><textarea data-summary rows="2" maxlength="400" placeholder="用一两句话介绍这篇文章"></textarea></label>

            <div class="content-field">
              <div class="content-label"><span>正文</span><div class="format-tools" aria-label="Markdown 快捷工具"><button type="button" data-insert="## ">标题</button><button type="button" data-wrap="**">加粗</button><button type="button" data-insert="> ">引用</button><button type="button" data-insert="- ">列表</button><button type="button" data-wrap="`">代码</button></div></div>
              <textarea data-content rows="20" placeholder="从这里开始写下正文…\n\n支持 Markdown。也可以直接粘贴截图，或把图片拖到这里。"></textarea>
              <div class="markdown-preview article-body" data-preview hidden></div>
            </div>

            <div class="upload-zone" data-upload-zone tabindex="0" role="button" aria-label="上传文章图片">
              <input type="file" data-file-input accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
              <div class="upload-icon">＋</div>
              <div><strong>添加文章图片</strong><p>点击选择、拖拽到这里，或直接在正文中粘贴截图。单张不超过 8 MB。</p></div>
              <span data-upload-state>JPG / PNG / WEBP / GIF</span>
            </div>
          </div>
        </form>
      </section>
    </main>
    <div class="toast" data-toast role="status" aria-live="polite"></div>
  </div>
</body>
</html>
