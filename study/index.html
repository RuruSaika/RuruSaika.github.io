<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RuruSaika 的学习档案：错题、思考与阶段性的自我修正。">
  <meta name="theme-color" content="#080b0e">
  <meta name="rurusaika-style-version" content="{{STYLE_VERSION}}">
  <meta property="og:title" content="Study Log — RuruSaika">
  <meta property="og:description" content="把想明白的过程留下。">
  <meta property="og:image" content="https://rurusaika.github.io/static/img/study-og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Study Log — RuruSaika</title>
  <link rel="icon" href="../static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="visual-v2.css?v={{STYLE_VERSION}}">
  <script src="shared.js" defer></script>
  <script src="board.js" defer></script>
</head>
<body>
  <div class="study-shell">
    <nav class="study-nav" aria-label="学习记录导航">
      <a class="study-brand" href="../"><i>R/</i><span>RuruSaika</span></a>
      <div class="study-nav-links">
        <a href="../">个人主页</a>
        <a href="#records">全部记录</a>
        <a class="admin-entry" href="admin/">写记录</a>
      </div>
    </nav>

    <header class="study-hero">
      <p class="kicker">考研学习记录</p>
      <h1>把每一次<br><span>想明白的过程留下。</span></h1>
      <p class="hero-note">这里保存错题、思考和阶段复盘。记录当时卡住的地方、后来找到的解释，以及下一次可以怎样判断。</p>
      <div class="hero-meta"><span>错题</span><span>笔记</span><span>复盘</span><span>持续整理</span></div>
    </header>

    <main id="records">
      <div class="board-toolbar">
        <label class="search-box"><span class="visually-hidden">搜索记录</span><input type="search" data-search placeholder="搜索标题、摘要或标签…" autocomplete="off"></label>
        <div class="subject-filters" data-filters aria-label="按科目筛选">
          <button class="filter-button active" type="button" data-subject="全部">全部</button>
          <button class="filter-button" type="button" data-subject="数学">数学</button>
          <button class="filter-button" type="button" data-subject="英语">英语</button>
          <button class="filter-button" type="button" data-subject="政治">政治</button>
          <button class="filter-button" type="button" data-subject="专业课">专业课</button>
          <button class="filter-button" type="button" data-subject="复盘">复盘</button>
        </div>
      </div>

      <div class="board-summary">
        <h2>记录索引</h2>
        <p data-count>LOADING...</p>
      </div>
      <section class="post-grid" data-posts aria-live="polite">
        <div class="loading-board">正在整理书桌…</div>
      </section>
    </main>

    <footer class="study-footer"><span>© <span data-year></span> RURUSAIKA / 学习记录</span><span>STYLE {{STYLE_VERSION}}</span></footer>
  </div>
</body>
</html>
