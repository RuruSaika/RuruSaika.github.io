<html lang="zh-CN" data-theme="light">

    <meta name="color-scheme" content="dark light">
    <meta name="description" content="RuruSaika 的 Blog。">
    <meta name="theme-color" content="#d8d9dd">
    <script>
        (() => {
            let theme = null;
            try { theme = localStorage.getItem("ruru-theme"); } catch { /* Use browser preference. */ }
            if (theme !== "light" && theme !== "dark") {
                theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <meta name="rurusaika-preference-version" content="2026.08.14.1">

    <title>RuruSaika — Blog</title>
