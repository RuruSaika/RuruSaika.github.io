name: Sync public blog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-blog.yml"
      - "scripts/sync-public-blog.mjs"
      - "static/js/blog.js"
      - "study/shared.js"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "What changed on the publishing origin"
        required: false
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-public-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOG_SOURCE_ORIGIN: https://rurusaika-home.rurusaika-official.chatgpt.site
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mirror published posts and images
        run: node scripts/sync-public-blog.mjs

      - name: Commit a changed snapshot
        id: snapshot
        shell: bash
        run: |
          git add static/blog
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync public blog snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages rebuild
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
