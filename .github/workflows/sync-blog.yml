name: Sync public blog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-blog.yml"
      - "scripts/sync-public-blog.mjs"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "What changed on the publishing origin"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-public-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLOG_SOURCE_ORIGIN: https://rurusaika-home.rurusaika-official.chatgpt.site
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mirror published posts and images
        run: node scripts/sync-public-blog.mjs

      - name: Commit a changed snapshot
        shell: bash
        run: |
          git add static/blog
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync public blog snapshot"
          git push origin HEAD:main
