<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="RuruSaika 的个人主页与 Blog。">
    <meta name="theme-color" content="#0b0e10">
    <meta name="rurusaika-preference-version" content="2026.08.12.4">
    <meta name="rurusaika-site-version" content="2026.08.12.4.2">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rurusaika.github.io/">
    <meta property="og:title" content="RuruSaika — 个人主页">
    <meta property="og:description" content="RuruSaika 的个人主页与 Blog。">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="RuruSaika — 个人主页">
    <meta name="twitter:description" content="RuruSaika 的个人主页与 Blog。">
    <title>RuruSaika — 个人主页</title>
    <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml" data-theme-favicon data-dark-href="static/img/favicon.svg" data-light-href="static/img/favicon-light.svg">
    <link rel="icon" href="static/img/favicon.ico" sizes="any">
    <link rel="icon" href="static/img/favicon-32.png" type="image/png" sizes="32x32" data-theme-favicon data-dark-href="static/img/favicon-32.png" data-light-href="static/img/favicon-light-32.png">
    <link rel="apple-touch-icon" href="static/img/apple-touch-icon-180.png" sizes="180x180">
    <link rel="stylesheet" href="static/vendor/katex/katex.min.css?v=0.18.4">
    <link rel="stylesheet" href="static/css/styles.css?v=2026.08.12.4.2">
    <script src="static/js/site-version.js?v=2026.08.12.4.2" defer></script>
    <script src="static/vendor/markdown-it/markdown-it.umd.min.js?v=15.0.0" defer></script>
    <script src="static/vendor/katex/katex.min.js?v=0.18.4" defer></script>
    <script src="static/vendor/katex/auto-render.min.js?v=0.18.4" defer></script>
    <script src="study/shared.js?v=2026.08.12.4.2" defer></script>
    <script src="static/js/blog.js?v=2026.08.12.4.2" defer></script>
    <script src="static/js/script.js?v=2026.08.12.4.2" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header" data-header>
        <a class="brand" href="#top" aria-label="回到页面顶部">RuruSaika</a>
        <nav class="main-nav" aria-label="主要导航">
            <a href="#top">首页</a>
            <a href="#blog">Blog</a>
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换为浅色主题" aria-pressed="false">
                <span data-theme-label>浅色</span>
            </button>
        </nav>
    </header>

    <main id="main" tabindex="-1">
        <section class="hero" id="top" aria-labelledby="hero-title">
            <div class="hero-heading">
                <p class="eyebrow">PERSONAL HOME</p>
                <h1 id="hero-title">
                    欢迎！<br>
                    <span class="hero-title-small">这里是</span><span class="hero-title-accent">Ruru</span><span class="hero-title-small">的个人博客</span>
                </h1>
            </div>
            <div class="hero-note">
                <a class="text-link" href="#blog">阅读 Blog <span aria-hidden="true">↓</span></a>
            </div>
        </section>

        <section class="blog-section" id="blog" aria-labelledby="blog-title" data-blog-section>
            <header class="blog-heading" data-blog-intro>
                <div>
                    <p class="eyebrow">BLOG</p>
                    <h2 id="blog-title">文章</h2>
                </div>
            </header>

            <div class="blog-index" data-blog-index>
                <div class="blog-toolbar">
                    <label class="blog-search">
                        <span class="visually-hidden">搜索文章</span>
                        <input type="search" data-blog-search placeholder="搜索文章" autocomplete="off">
                    </label>
                    <div class="blog-controls">
                        <div class="blog-filters" data-blog-filters aria-label="按分类筛选">
                            <button class="active" type="button" data-category="全部">全部</button>
                            <button type="button" data-category="生活">生活</button>
                            <button type="button" data-category="学习">学习</button>
                            <button type="button" data-category="其它">其它</button>
                        </div>
                        <div class="blog-sort" data-blog-sort aria-label="文章排序方式">
                            <span>排序</span>
                            <button class="active" type="button" data-sort-mode="manual">推荐</button>
                            <button type="button" data-sort-mode="date">最新修改</button>
                        </div>
                    </div>
                </div>

                <div class="blog-summary">
                    <span>文章索引</span>
                    <p data-blog-count>LOADING...</p>
                </div>
                <div class="blog-list" data-blog-posts aria-live="polite">
                    <div class="blog-empty">正在整理文章……</div>
                </div>
            </div>

            <article class="blog-reader" data-blog-reader hidden aria-live="polite">
                <button class="blog-back" type="button" data-blog-back>← 返回全部文章</button>
                <div data-blog-article><div class="blog-article-state">正在打开文章……</div></div>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        <span>© <span data-year>2026</span> RuruSaika</span>
        <span>V. <span data-site-version>2026.08.12.4.2</span></span>
    </footer>
</body>
</html>
